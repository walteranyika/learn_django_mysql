<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-8">

        </div>
        <div class="col-sm-4 justify-content-center">
            <form action="{% url 'signin' %}" method="post" class="mt-5 w-75">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        {{ field.errors }}
                        {{ field.label_tag }}
                        {{ field }}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-info w-100">Signin</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-7"></div>
        <div class="col-sm-5">
            <div class="row justify-content-center">
                <div class="col-sm-10">
                    <div class="card mt-5 p-3">
                        <form action="{% url 'signup' %}" method="post">
                            {% csrf_token %}
                            {% for field in form %}
                                <div class="mb-3">
                                    {{ field.errors }}
                                    {{ field.label_tag }}
                                    {{ field }}
                                </div>
                            {% endfor %}
                            <button type="submit" class="btn btn-info w-100">Sign up</button>

                        </form>

                        <p class="text-center mt-3"><a href="{% url 'signin' %}">Have An Account? Signin</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

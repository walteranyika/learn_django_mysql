{% extends 'master.html' %}
{% load django_bootstrap5 %}
{% block title %} Create Author {% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-sm-4">
                <form action="{% url 'create_book' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                     {% bootstrap_form form %}
                    <button class="btn btn-info w-100">Save Book</button>
                </form>
            </div>
            <div class="col-sm-6">

            </div>
        </div>
    </div>
{% endblock %}

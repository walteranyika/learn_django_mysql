{% extends 'master.html' %}
{% block title %} Authors {% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-8">
                <h1>Authors</h1>
                <table class="table">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                    </tr>
                    {% for author in authors %}
                        <tr>
                            <td>{{  forloop.counter  }}</td>
                            <td>{{ author.names }}</td>
                            <td>{{ author.email }}</td>
                            <td>{{ author.phone }}</td>
                        </tr>
                    {% endfor %}
                </table>

            </div>
        </div>
    </div>
{% endblock %}

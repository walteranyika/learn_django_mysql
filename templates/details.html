{% extends 'master.html' %}
{% block title %} Book Details {% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-sm-4">
                <h3>{{ book.title }}</h3>
                <p>{{ book.author.names }}</p>
                <p>{{ book.cost }}</p>
                <p>{{ book.created_at }}</p>
            </div>
            <div class="col-sm-6">
                {% if book.cover %}
                    <img src="{{ book.cover.url }}" alt="">
                {% endif %} 
            </div>
        </div>
    </div>
{% endblock %}

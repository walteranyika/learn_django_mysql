<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-sm border-bottom shadow-sm bg-light">
    <div class="container">
        <a class="navbar-brand" href="javascript:void(0)">Library MIS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'authors' %}">Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'books' %}">Authors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'create_author' %}">Add Authors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'create_book' %}">Add Book</a>
                </li>
                <li class="nav-item">
                    <form action="{% url 'signout' %}" method="post">
                        {% csrf_token %}
                        <button class="btn btn-outline-dark">{{ user.first_name }}</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
